name: Convert Chucky assets to WebP

on:
  push:
    branches: [main]
    paths:
      - 'public/letras-sin-fondo.png'
      - 'public/pedido-oficial.png'
      - '.github/workflows/convert-chucky-images.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert assets
        run: |
          python - <<'PY'
          from PIL import Image

          jobs = [
              ('public/letras-sin-fondo.png', 'public/chucky-logo.webp', 1200, 80),
              ('public/pedido-oficial.png', 'public/chucky-door.webp', 768, 80),
          ]

          for src, dst, max_width, quality in jobs:
              im = Image.open(src)
              if im.width > max_width:
                  h = round(im.height * max_width / im.width)
                  im = im.resize((max_width, h), Image.Resampling.LANCZOS)
              im.save(dst, 'WEBP', quality=quality, method=6)
          PY

      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chucky-logo.webp public/chucky-door.webp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets: generate optimized Chucky WebP images"
            git push
          fi
